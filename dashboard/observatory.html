/* Market homepage */
.front-page{background:#f6f7f5}
.front-page main{padding-top:0}
.front-page .dateline,.front-page .heading{display:none}
.quotes{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border-bottom:1px solid #cbd8d3;padding:15px 0}
.quote{background:transparent;border:0;border-right:1px solid #d6dfda;text-align:left;padding:0 10px;min-width:0}
.quote:first-child{padding-left:0}
.quote:last-child{border:0}
.quote span,.quote b,.quote small{display:block}
.quote span{font-size:12px;font-weight:650}
.quote b{font-size:18px;letter-spacing:-.6px}
.quote small{font-size:10px;font-weight:600}
.lead{display:grid;grid-template-columns:minmax(0,2fr) minmax(180px,.85fr);gap:5%;align-items:center;margin:17px 0;color:#f5faf5;background:#17352f;border-radius:9px;padding:20px 25px}
.lead h1{font:500 clamp(26px,2.65vw,43px)/1.04 Georgia,serif;letter-spacing:-1.4px;margin:7px 0}
.lead p{font-size:13px;color:#d0e1d6}
.lead-date{font:650 11px var(--mono);letter-spacing:.09em;color:#a0e2c0}
.lead-date span{margin-left:12px;color:#c2d8cc;letter-spacing:0;font-weight:400}
.close-figure{margin:0;min-width:0}
.close-figure figcaption,.close-figure>div{display:flex;justify-content:space-between;font:11px var(--mono);color:#bed3c8}
.close-figure figcaption b{color:white}
.close-figure svg{display:block;width:100%;height:63px;margin:5px 0}
.home-grid{display:grid;grid-template-columns:minmax(0,2.35fr) minmax(245px,.9fr);gap:15px}
.home-panel{background:white;border:1px solid #d4ded8;border-radius:8px;padding:15px 18px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:10px}
.panel-head h2{font-size:20px;letter-spacing:-.7px}
.panel-head a{font-size:12px;font-weight:650;text-decoration:none}
.desk-table{font-size:13px}
.desk-table td{padding:7px 5px}
.desk-table th{font-size:9px;padding:6px 5px}
.desk-table :is(td,th):nth-child(2){text-align:left}
.desk-table tbody tr:last-child td{border:0}
.desk-table td span{display:block;font-size:10px;color:#586c69}
.desk-table .desk-link{display:inline-block;border-left:3px solid var(--desk);padding-left:8px;color:#233d37;text-decoration:none;font-weight:670}
.desk-table td button{font-size:13px;color:#233745}
.desk-table .desk-level{font-weight:680}
.desk-table .desk-trend{width:76px}
.desk-table .spark{width:68px;height:24px;vertical-align:middle}
.desk-table .desk-peer{white-space:normal}
.desk-table .desk-peer span{font-size:11px}
.movers-panel ol{list-style:none;padding:0;margin:7px 0}
.movers-panel li{display:flex;align-items:center;gap:9px;border-bottom:1px solid #e2e8e4;padding:7px 0}
.movers-panel li:last-child{border:0}
.rank{font:11px var(--mono);color:#677f75}
.movers-panel li button{min-width:0;flex:1;text-align:left;background:transparent;border:0;padding:0}
.movers-panel li button b,.movers-panel li button small{display:block}
.movers-panel li button b{font-size:13px}
.movers-panel li button small,.universe{font-size:10px;color:var(--muted)}
.movers-panel li strong{font-size:14px}
.world-panel{margin-top:15px}
.world-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.world-grid button{text-align:left;padding:4px 10px;border:0;border-left:2px solid #d7e4de;background:none}
.world-grid button>*{display:block}
.world-grid span{font-size:12px;font-weight:650}
.world-grid b{font-size:18px}
.world-grid small{font-size:12px}
.world-grid em{font-size:10px;font-style:normal;color:var(--muted)}
.quote:hover,.world-grid button:hover{background:#eaf2ec}
@media(max-width:1100px){.desk-peer{display:none}.quotes{display:flex;overflow-x:auto}.quote{min-width:126px;flex:1}.home-grid{grid-template-columns:minmax(0,1.8fr) minmax(220px,1fr)}}
@media(max-width:760px){.home-grid{grid-template-columns:1fr}.desk-table .desk-trend{display:none}.lead{grid-template-columns:1fr;padding:14px 16px}.close-figure{display:none}.home-panel{padding:12px}.quotes{padding:9px 0}.quote{min-width:112px}.quote b{font-size:16px}.lead h1{font-size:27px}.lead p{font-size:12px}.desk-table td,.desk-table th{padding:6px 2px}.desk-table td,.desk-table td button{font-size:12px}.desk-table .desk-link{padding-left:4px}.desk-table .desk-move span{font-size:9px}.panel-head h2{font-size:18px}.world-panel .panel-head{flex-wrap:wrap}.world-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Long-form daily edition */
.edition-contents{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;margin:-2px 0 17px;padding:0 2px 10px;border-bottom:1px solid #c9d7ce}
.edition-contents :is(button,a){border:0;background:none;padding:3px 0;color:#264c42;font-size:12px;font-weight:620;text-decoration:none}
.edition-contents span{color:#788e81;margin-left:3px}
.edition-contents a{margin-left:auto}
.edition-contents :is(button,a):hover,.pulse-card button:hover,.dispatch-table button:hover{text-decoration:underline}
.mover-change{text-align:right;white-space:nowrap}
.mover-change :is(strong,small){display:block}
.mover-change small{color:#586c69;font-size:10px}
.pulse-section,.dispatches,.rotation-detail,.thesis-panel{margin-top:24px;scroll-margin-top:15px}
.edition-section,.dispatch-intro{border-top:3px solid #2a4a3f;padding:14px 0 12px}
.edition-section{display:flex;align-items:end;justify-content:space-between;gap:10px}
.edition-section h2,.dispatch-intro h2,.rotation-detail .panel-head h2,.thesis-panel .panel-head h2{font:500 clamp(24px,2.2vw,35px)/1.1 Georgia,serif;letter-spacing:-1px}
.edition-section p,.dispatch-intro>p:last-child{color:#50655c;margin-top:4px}
.section-meta,.pulse-desk,.dispatch-label h3{font:650 10px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.08em}
.section-meta,.pulse-desk{color:#466c5e}
.pulse-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pulse-card{color:#20372e;background:#edf2ea;border:1px solid #cbd7cc;border-radius:7px;padding:15px 18px;min-width:0}
.pulse-card h3 button{padding:0;border:0;background:none;text-align:left;font-family:inherit;line-height:1.3;font-size:18px;font-weight:650;letter-spacing:-.55px}
.pulse-card h3 span{font:13px var(--mono);color:#567662}
.pulse-number{display:flex;align-items:baseline;gap:10px;margin:3px 0 7px}
.pulse-number b{font-size:22px;letter-spacing:-.7px}
.pulse-number span{font:620 12px var(--mono)}
.pulse-chart{margin:10px 0}
.pulse-chart svg{display:block;width:100%;height:70px}
.pulse-chart figcaption{display:flex;justify-content:space-between;color:#54665a;font:10px var(--mono)}
.pulse-card>p{font-size:12px;line-height:1.5}
.pulse-method,.thesis-method{font-size:12px;color:var(--muted);margin-top:10px}
.pulse-method summary,.thesis-method summary{cursor:pointer;color:#2d5c4d;font-weight:620;width:fit-content;max-width:100%}
.pulse-method p,.thesis-method p{max-width:88ch;margin-top:6px}
.dispatch-intro,.dispatch-label{background:transparent;color:inherit}
.dispatch-intro .eyebrow{color:#4c7160;margin:0 0 5px}
.dispatch-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.dispatch-card{display:flex;flex-direction:column;min-width:0;padding:17px 20px 12px;background:#fff;border:1px solid #d5dfd7;border-radius:6px}
.dispatch-label{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:2px solid #829b8b;padding:8px 0 0}
.dispatch-label h3{color:#305849}
.dispatch-label time{font:11px var(--mono);color:#616f65}
.dispatch-card h4{font:500 clamp(21px,1.7vw,28px)/1.12 Georgia,serif;letter-spacing:-.65px;color:#172e24;margin:12px 0 6px}
.dispatch-copy{font-size:13px;line-height:1.55;color:#31433b;max-width:78ch}
.dispatch-tablewrap{overflow:auto;margin:12px 0 6px}
.dispatch-table{white-space:normal;font-size:13px}
.dispatch-table :is(th,td){padding:6px 3px 5px}
.dispatch-table thead th{border-block:1px solid #e0e6e1;background:#f6f8f5}
.dispatch-table tbody th{font:inherit;letter-spacing:normal;text-transform:none}
.dispatch-table th button{background:none;border:0;padding:0;color:#213e36;font-size:13px;font-weight:650;text-align:left}
.dispatch-table :is(td,th)>small{display:block;margin:1px 0 0;color:#617268;font:10px/1.25 var(--mono);text-transform:none;letter-spacing:0}
.dispatch-table td{white-space:nowrap}
.dispatch-note{margin-top:auto;font-size:11px;line-height:1.45;color:#617268}
.rotation-detail,.thesis-panel{padding:20px 23px}
.rotation-layout{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(235px,.8fr);gap:30px}
.rotation-layout>div,.thesis-layout>article{min-width:0}
.rotation-note,.thesis-reading{font-size:13px;color:#354a41;line-height:1.55}
.rotation-scorecard :is(td,th){padding:8px 6px}
.rotation-scorecard td button{color:#205b4d}
.rotation-scorecard tbody tr:nth-child(2n){background:#f7f9f7}
.rotation-scorecard td small{display:block;margin:0;font:10px var(--mono)}
.rotation-method{margin-top:7px}
.rotation-styles,.thesis-evidence{border-left:1px solid var(--line);padding-left:22px}
.rotation-styles h3,.thesis-subhead h3{font-size:17px;letter-spacing:-.4px;line-height:1.3}
.rotation-pair{margin-top:15px}
.rotation-pair .spread{font-size:12px}
.rotation-axis{position:relative;background:#edf1ef;height:8px;margin:4px 0}
.rotation-axis:before{content:"";position:absolute;height:12px;top:-2px;left:50%;width:1px;background:#899b91}
.rotation-axis i{position:absolute;top:0;bottom:0}
.rotation-styles .rotation-note{border-top:1px solid var(--line);margin-top:14px;padding-top:9px}
.thesis-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px}
.thesis-subhead{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}
.thesis-choice{font-size:12px;color:#4d6257}
.thesis-choice select{margin-left:4px}
.thesis-asof{margin-top:5px}
.thesis-published{margin:15px 0;padding-left:14px;border-left:3px solid #82aa92;color:#224d3a;font:400 20px/1.4 Georgia,serif}
.thesis-metrics{display:grid;grid-template-columns:repeat(3,1fr);padding:10px 0;border-block:1px solid var(--line);gap:8px}
.thesis-metrics dt{font-size:11px;line-height:1.35;color:var(--muted)}
.thesis-metrics dd{margin:3px 0 0;font-size:18px;font-weight:650}
.thesis-book .link{display:inline-block;margin:9px 0}
.thesis-chart{margin:12px 0 5px}
.thesis-chart svg{width:100%;display:block;max-height:170px}
.thesis-chart figcaption{font-size:11px;color:var(--muted)}
@media(max-width:970px){.rotation-layout{grid-template-columns:1fr}.rotation-styles{padding:14px 0 0;border-left:0;border-top:1px solid var(--line)}.dispatch-card{padding:14px}}
@media(max-width:740px){.edition-contents{gap:3px 14px}.edition-contents a{margin-left:0}.edition-contents :is(a,button){padding:5px 0}.pulse-grid,.dispatch-grid,.thesis-layout{grid-template-columns:minmax(0,1fr)}.pulse-grid{gap:8px}.pulse-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(115px,.9fr);gap:2px 6px;padding:12px}.pulse-card h3,.pulse-card .pulse-number{grid-column:1}.pulse-card .pulse-chart{grid-column:2;grid-row:1/4;align-self:center;margin:0}.pulse-chart svg{height:auto}.pulse-card>p{grid-column:1/-1;margin-top:3px}.pulse-number{margin:0}.edition-section{align-items:start}.section-meta{display:none}.dispatch-copy{font-size:14px}.rotation-detail,.thesis-panel{padding:15px}.thesis-evidence{border-left:0;padding:15px 0 0;border-top:1px solid var(--line)}.thesis-panel .panel-head{align-items:start}.thesis-panel .panel-head a{white-space:nowrap;font-size:11px}.thesis-published{font-size:19px}.rotation-scorecard th:first-child,.rotation-scorecard td:first-child{position:sticky;left:0;background:#fff}.thesis-metrics dd{font-size:16px}.dispatch-table{font-size:12px}}

.freshness{font-size:11px;border-bottom:1px solid #c8d7ce;color:#496259}
.freshness>summary{display:flex;align-items:center;justify-content:space-between;gap:6px 20px;list-style:none;cursor:pointer;padding:9px 0}
.freshness>summary::-webkit-details-marker{display:none}
.freshness summary i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#328368;margin-right:6px}
.freshness.overdue summary i{background:#ae6531}
.freshness.overdue summary{color:#82501f}
.freshness-more{margin-left:10px;color:#264d40}
.freshness-body{display:grid;grid-template-columns:1.3fr .8fr 1fr;gap:25px;padding:14px 0 20px;line-height:1.5}
.freshness-body h3{font-size:13px;margin-bottom:6px}
.freshness-body p{margin-bottom:8px;max-width:65ch}
.freshness-body table{font-size:11px}
.freshness-body tbody th{font-family:inherit;font-size:11px;font-weight:500;letter-spacing:0;text-transform:none;color:inherit}

// Every sector and style is measured on the same US trading dates. A missing
// endpoint stays missing, including when an individual ETF has a later close.
function rotationMonthEnd(day, monthsBack) {
 const [year, month, dayOfMonth] = day.split("-").map(Number);
 const last = new Date(Date.UTC(year, month - monthsBack, 0));
 last.setUTCDate(Math.min(dayOfMonth, last.getUTCDate()));
 return last.toISOString().slice(0, 10);
}

function rotationReturns(row, dates) {
 const prices = new Map(row?.history || []);
 function change(start, end) {
  const a = prices.get(start), b = prices.get(end);
  return Number.isFinite(a) && Number.isFinite(b) && a > 0 && b > 0
   ? 100 * (b / a - 1) : null;
 }
 return {
  pct: change(dates.prev, dates.end), month: change(dates.month, dates.end),
  prior: change(dates.two, dates.month), six: change(dates.six, dates.end)
 };
}

function rotationData() {
 const benchmark = byId.get("spy") || byId.get("spx");
 const anchor = benchmark || sectors.slice().sort((a,b) => b.stats.day.localeCompare(a.stats.day))[0];
 if (!anchor?.history?.length) return null;
 const history = anchor.history;
 const end = history.at(-1)[0];
 function anchorDate(months) {
  const cutoff = rotationMonthEnd(end, months);
  return history.filter(([d]) => d <= cutoff).at(-1)?.[0];
 }
 const dates = {
  end, prev: history.at(-2)?.[0], month: anchorDate(1), two: anchorDate(2), six: anchorDate(6)
 };
 const rows = sectors.map(row => ({row, ...rotationReturns(row, dates)}));
 return {dates, rows, benchmark, reference: rotationReturns(benchmark, dates)};
}

const rotationWindows = [["pct", "1D"], ["month", "1M"], ["six", "6M"]];

  '<p class="empty">No sector ETFs have both closing prices for this window.</p>', control);

  const color = v === 0 ? "164,177,177" : v > 0 ? "66,174,142" : "222,129,116";

 }).join("");

 const span = ranked[0][sectorWindow] - ranked.at(-1)[sectorWindow];
 let summary = ranked.length > 1 ? 'The spread from first to last was '+f(span)+' percentage points.' : '';
 const leader = ranked[0], dailyContext = sectorWindow === "pct" && leader[sectorWindow] > 0 && Number.isFinite(leader.month);
 if (dailyContext && leader.month < 0) summary += ' '+leader.row.name+' led this session but remains '+f(Math.abs(leader.month))+'% below its month-ago close.';
 return section("Sector rotation", "US sector ETF price returns · "+shortDate(start)+" – "+shortDate(dates.end),
  '<div class="matrix">'+tiles+'</div><div class="breadth"><b>'+up+' / '+ranked.length+'</b><div class="track"><i style="width:'+
  100*up/ranked.length+'%"></i></div></div><p class="mini rotation-summary">Sectors advancing. '+summary+'</p>', control);

// Competition ranking preserves ties at the same precision as the table.
function rotationRanks(rows, key) {
 const sorted = rows.filter(r => Number.isFinite(r[key])).slice()
  .sort((a,b) => b[key] - a[key] || a.row.symbol.localeCompare(b.row.symbol));
 const ranks = new Map();
 let previous, rank;
 sorted.forEach((r,i) => {
  const value = Number(r[key].toLocaleString("en-US", {maximumFractionDigits:2,useGrouping:false}));
  if (i === 0 || previous !== value) rank = i+1;
  ranks.set(r.row.id, rank);
  previous = value;
 });
 return ranks;
}

function rotationRankingNote(rows, current, previous, comparable) {
 const leaders = rows.filter(r => current.get(r.row.id) === 1);
 if (!leaders.length) return 'A monthly ranking needs both US closing prices for each ETF.';
 const names = new Intl.ListFormat("en-US", {style:"long",type:"conjunction"});
 const ties = names.format(leaders.map(r => r.row.name));
 let text = ties + (leaders.length > 1 ? " share the one-month lead at " : " leads the month at ")+pct(leaders[0].month)+".";
 if (!comparable) return text;
 const moves = rows.filter(r => current.has(r.row.id)).map(r => ({
  name:r.row.name, gain:previous.get(r.row.id)-current.get(r.row.id)
 }));
 const best = Math.max(...moves.map(r => r.gain));
 if (best > 0) {
  const gainers = moves.filter(r => r.gain === best);
  text += " "+names.format(gainers.map(r => r.name))+(gainers.length === 1 ? " climbed " : " each climbed ")+
   best+(best === 1 ? " place" : " places")+" from the previous month.";
 } else if (moves.every(r => r.gain === 0)) text += " The order is unchanged from the prior month.";
 return text;
}

function rotationStyles(dates) {
 const specifications = [
  ["Small vs. large cap","iwm","spy"], ["Equal vs. cap weight","rsp","spy"],
  ["Growth vs. value","iwf","iwd"], ["Momentum vs. large cap","mtum","spy"], ["Quality vs. large cap","qual","spy"]
 ];
 const pairs = specifications.map(([name,left,right]) => {
  const a = byId.get(left), b = byId.get(right);
  const lhs = rotationReturns(a, dates).month, rhs = rotationReturns(b, dates).month;
  const gap = Number.isFinite(lhs) && Number.isFinite(rhs) ? lhs-rhs : null;
  return {name, a, b, gap};
 });
 const scale = Math.max(.01, ...pairs.map(p => Math.abs(p.gap || 0)));
 const bars = pairs.map(({name,a,b,gap}) => {
  const magnitude = Math.abs(gap||0)/scale*50;
  const bar = Number.isFinite(gap) ? '<i style="left:'+(gap < 0 ? 50-magnitude : 50)+'%;width:'+magnitude+'%;background:'+
   (gap < 0 ? '#b16e64' : '#3c8876')+'"></i>' : '';
  return '<div class="rotation-pair"><div class="spread"><b>'+esc(name)+'</b><strong class="'+cls(gap)+'">'+
   (Number.isFinite(gap) ? sf(gap)+' pp' : '—')+'</strong></div><div class="rotation-axis" aria-hidden="true">'+bar+
   '</div><small class="mini">'+esc((a?.symbol || '—')+' minus '+(b?.symbol || '—'))+'</small></div>';
 }).join("");
 const [size,weight] = pairs;
 let read = '';
 if (Number.isFinite(size.gap) && Number.isFinite(weight.gap)) {
  if (size.gap > 0 && weight.gap > 0) read = 'Small caps and equal weight both beat cap-weighted large caps over the month. Leadership extended beyond the largest US names.';
  else if (size.gap < 0 && weight.gap < 0) read = 'Small caps and equal weight both trailed cap-weighted large caps over the month. The largest names had the relative advantage.';
  else if (size.gap * weight.gap < 0) read = size.gap > 0 ?
   'Small caps beat large caps over the month, even as equal weight lagged within the S&P 500. The two measures of breadth diverged.' :
   'Equal weight beat cap weight within the S&P 500, even as small caps lagged. Broader leadership inside large caps has yet to extend down the size spectrum.';
 }
 return '<aside class="rotation-styles"><h3>Size &amp; style spreads</h3><p class="note">One-month return of the first ETF minus the second, in percentage points.</p>'+
  bars+(read?'<p class="rotation-note">'+read+'</p>':'')+'</aside>';
}

function rotationDetail() {
 const data = rotationData();

 const {rows, dates, reference, benchmark} = data;
 const current = rotationRanks(rows,"month"), previous = rotationRanks(rows,"prior");
 const comparable = current.size > 0 && current.size === previous.size && [...current.keys()].every(id => previous.has(id));

 const sorted = rows.slice().sort((a,b) => (current.get(a.row.id) ?? Infinity)-(current.get(b.row.id) ?? Infinity) || a.row.name.localeCompare(b.row.name));

  const {row} = r, rank = current.get(row.id);
  const shift = comparable && rank ? previous.get(row.id)-rank : null;
  const gap = Number.isFinite(r.month) && Number.isFinite(reference.month) ? r.month-reference.month : null;
  const rankMove = !Number.isFinite(shift) ? '—' : shift > 0 ? '↑ '+shift : shift < 0 ? '↓ '+Math.abs(shift) : 'Unch.';
  return '<tr><td><button data-focus="'+esc(row.id)+'">'+esc(row.name)+'</button><small>'+esc(row.symbol)+'</small></td>'+

   '<td class="'+cls(gap)+'">'+(Number.isFinite(gap)?sf(gap)+' pp':'—')+'</td><td>'+rankMove+'</td></tr>';
 }).join("");
 const table = '<div class="tablebox" role="region" aria-label="Sector return rankings" tabindex="0"><table class="rotation-scorecard"><thead><tr>'+
  '<th scope="col">Sector</th><th scope="col">1M rank</th><th scope="col">1D</th><th scope="col">1M</th><th scope="col">6M</th><th scope="col">1M vs '+esc(relative)+
  '</th><th scope="col">Rank change</th></tr></thead><tbody>'+cells+'</tbody></table></div>';
 const measured = rows.filter(r => Number.isFinite(r.month));
 const outperform = measured.filter(r => r.month > reference.month).length;
 const breadth = Number.isFinite(reference.month) && measured.length ? ' '+outperform+' of '+measured.length+' beat '+relative+
  ' over the month ('+pct(reference.month)+').' : '';
 const window = [dates.month && '1M from '+shortDate(dates.month), dates.six && '6M from '+shortDate(dates.six)].filter(Boolean).join(" · ");
 const method = 'Price returns through '+dateLabel(dates.end)+(window?' · '+window:'')+'. '+
  (comparable && dates.two ? 'Rank change compares with '+shortDate(dates.two)+' – '+shortDate(dates.month)+'. Ties share a rank.' :
   'Rank changes require the same sector coverage in both months.');
 return '<section id="rotation-detail" class="home-panel rotation-detail"><div class="panel-head"><h2>Sector leadership &amp; equity style</h2></div>'+
  '<div class="rotation-layout"><div><p class="rotation-note">'+esc(rotationRankingNote(sorted,current,previous,comparable)+breadth)+'</p>'+table+
  '<p class="mini rotation-method">'+esc(method)+'</p></div>'+rotationStyles(dates)+'</div></section>';
}

// Editorial copy uses the same dated observations as the tape. Compare daily
// returns only when the two instruments span the same pair of session dates.
function dispatchPeriodsMatch(a, b, period = "pct") {
  if (!a || !b || a.stats.day !== b.stats.day) return false;
  const anchor = period === "six" ? "base" : "previous_day";
  return Boolean(a.stats[anchor]) && a.stats[anchor] === b.stats[anchor]
    && Number.isFinite(a.stats[period]) && Number.isFinite(b.stats[period]);
}

function dispatchGap(a, b, period = "pct") {
  return dispatchPeriodsMatch(a, b, period) ? a.stats[period] - b.stats[period] : null;
}

function dispatchComparison(subject, gap, peer) {
  if (Math.abs(gap) < .005) return subject + " finishes level with " + peer;
  return subject + (gap > 0 ? " outpaces " : " trails ") + peer + " by " + f(Math.abs(gap)) + " pp";
}

function dispatchVerb(value) {
  return value > 0 ? "rose" : value < 0 ? "fell" : "finished flat";
}

function dispatchPrecision(r) {
  if (r.group === "FX" && r.id !== "dxy") return 4;
  return ["natgas","copper","silver"].includes(r.id) ? 3 : 2;
}

function dispatchPoint(r) {
  return f(r.stats.last, dispatchPrecision(r)) + " " + r.unit;
}

function dispatchFallback(rows) {
  const ordered = [...rows].filter(r => Number.isFinite(r.stats.pct)).sort((a,b) => b.stats.day.localeCompare(a.stats.day));
  if (!ordered.length) return ["Session comparison pending", "A dated comparison will appear when closing prices are available."];
  const r = ordered[0], s = r.stats;
  const context = Number.isFinite(s.six) ? " Its six-month price change was " + pct(s.six) + "." : "";
  return [r.name + " closes at " + dispatchPoint(r), "From " + shortDate(s.previous_day) + " to " + shortDate(s.day) + ", " + r.name + " " + dispatchVerb(s.pct) + " (" + pct(s.pct) + ")." + context];
}

function dispatchAmericas(rows) {
  const small = byId.get("rut"), large = byId.get("spx"), tsx = byId.get("tsx");
  const gap = dispatchGap(small, large);
  if (gap === null) return dispatchFallback(rows);
  const headline = dispatchComparison("The Russell 2000", gap, "the S&P 500");
  const dow = byId.get("dji"), nasdaq = byId.get("ixic");
  const us = [large,small,dow,nasdaq].filter(r => dispatchPeriodsMatch(r,large));
  const lower = us.filter(r => r.stats.pct < 0).length, higher = us.filter(r => r.stats.pct > 0).length;
  let copy = lower === us.length ? "Every tracked US benchmark in the table fell." : higher === us.length ? "Gains reached every tracked US benchmark in the table." : higher + " of " + us.length + " US benchmarks in the table closed higher.";
  const six = dispatchGap(small, large, "six");
  if (six !== null && Math.abs(gap) >= .005 && Math.abs(six) >= .005) {
    const ahead = six > 0 ? "ahead of" : "behind";
    copy += " Small caps are " + f(Math.abs(six)) + " percentage points " + ahead + " the S&P over six months. The daily ranking " + (gap * six > 0 ? "echoed that longer trend." : "ran against that longer trend.");
  }
  if (dispatchPeriodsMatch(tsx, large)) copy += " In Canada, the TSX " + dispatchVerb(tsx.stats.pct) + " (" + pct(tsx.stats.pct) + ") in local currency.";
  return [headline, copy];
}

function dispatchEurope(rows) {
  const uk = byId.get("ftse"), euro = byId.get("stoxx50"), gap = dispatchGap(uk,euro);
  if (gap === null) return dispatchFallback(rows);
  const opposed = uk.stats.pct * euro.stats.pct < 0;
  const headline = opposed
    ? (uk.stats.pct > 0 ? "London rises as eurozone blue chips slip" : "Eurozone blue chips rise as London slips")
    : dispatchComparison("The FTSE 100", gap, "the Euro STOXX 50");
  let copy = "The FTSE 100 moved " + sf(uk.stats.change) + " index points in London and the Euro STOXX 50 moved " + sf(euro.stats.change) + " in the euro area.";
  const six = dispatchGap(uk, euro, "six");
  if (six !== null && Math.abs(six) >= .005) copy += " Over six months, " + (six > 0 ? "London leads eurozone blue chips" : "eurozone blue chips lead London") + " by " + f(Math.abs(six)) + " percentage points in local-currency price terms.";
  return [headline, copy];
}

function dispatchAsia(rows) {
  if (rows.length < 2 || !rows.every(r => dispatchPeriodsMatch(r,rows[0]))) return dispatchFallback(rows);
  const ranked = [...rows].sort((a,b) => b.stats.pct - a.stats.pct);
  const top = ranked[0], last = ranked.at(-1), rising = ranked.filter(r => r.stats.pct > 0);
  const falling = ranked.filter(r => r.stats.pct < 0);
  const place = {nikkei:"Japan",hsi:"Hong Kong",nifty:"India"};
  const headline = rising.length === 1 && falling.length === rows.length-1
    ? place[top.id] + " rises as its regional peers fall"
    : falling.length === 1 && rising.length === rows.length-1
    ? place[last.id] + " falls as its regional peers rise"
    : dispatchComparison(top.name,top.stats.pct-last.stats.pct,last.name);
  let copy = "The strongest local close was " + top.name + " (" + pct(top.stats.pct) + "), against " + pct(last.stats.pct) + " for the " + last.name + ".";
  if (rows.every(r => dispatchPeriodsMatch(r,rows[0],"six"))) {
    const longLeader = [...rows].sort((a,b) => b.stats.six - a.stats.six)[0];
    copy += " " + place[longLeader.id] + (longLeader.id === top.id ? " also leads" : " still leads") + " these markets over six months at " + pct(longLeader.stats.six) + ".";
  }
  return [headline, copy];
}

function dispatchRatesRows() {
  return ["2Y","5Y","10Y","30Y"].flatMap(tenor => {
    const dates = curves.filter(r => Number.isFinite(r.rates[tenor]));
    if (dates.length < 2) return [];
    const day = dates.at(-1), prior = dates.at(-2), last = day.rates[tenor];
    const target = new Date(day.date + "T00:00:00Z");
    const monthDay = target.getUTCDate();
    target.setUTCDate(1);
    target.setUTCMonth(target.getUTCMonth()-6);
    const lastMonthDay = new Date(Date.UTC(target.getUTCFullYear(),target.getUTCMonth()+1,0)).getUTCDate();
    target.setUTCDate(Math.min(monthDay,lastMonthDay));
    const anchor = target.toISOString().slice(0,10);
    const base = dates.filter(r => r.date <= anchor).at(-1);
    return [{id:tenor, name:tenor.slice(0,-1)+"-year Treasury", unit:"%", yield:true,
      stats:{day:day.date, previous_day:prior.date, last,
        change:Math.round(100*(last-prior.rates[tenor])), base:base?.date,
        six:base ? Math.round(100*(last-base.rates[tenor])) : null}}];
  });
}

function dispatchRates(rows) {
  const two = rows.find(r => r.id === "2Y"), ten = rows.find(r => r.id === "10Y");
  if (!two || !ten || two.stats.day !== ten.stats.day || two.stats.previous_day !== ten.stats.previous_day) {
    return ["Treasury yields by maturity", "Each tenor is dated separately. The curve comparison requires matching observations at two and ten years."];
  }
  const spread = Math.round(100*(ten.stats.last-two.stats.last)), change = ten.stats.change-two.stats.change;
  const headline = change ? "The 2s10s curve " + (change > 0 ? "steepens " : "flattens ") + Math.abs(change) + " bp" : "The 2s10s curve holds its slope";
  const relation = spread === 0 ? "equal to the two-year yield" : f(Math.abs(spread),0) + " bp " + (spread > 0 ? "above" : "below") + " the two-year";
  const copy = "The 10-year finished at " + f(ten.stats.last) + "%, " + relation + ". The two-year yield " + dispatchVerb(two.stats.change)
    + " (" + sf(two.stats.change,0) + " bp), versus " + sf(ten.stats.change,0) + " bp at ten years. "
    + (change === 0 ? "Both ends moved by the same amount." : "The " + (Math.abs(two.stats.change) === Math.abs(ten.stats.change) ? "two maturities moved equally in opposite directions." : Math.abs(two.stats.change) > Math.abs(ten.stats.change) ? "larger repricing came at the short end." : "larger repricing came at the long end."));
  return [headline, copy];
}

function dispatchCredit(rows) {
  const high = byId.get("hyg"), ig = byId.get("lqd"), loans = byId.get("bkln");
  const gap = dispatchGap(high, ig);
  if (gap === null) return dispatchFallback(rows);
  const headline = dispatchComparison("High yield", gap, "investment grade");
  const both = high.stats.pct * ig.stats.pct > 0;
  let copy = both ? "Both corporate bond ETFs " + dispatchVerb(high.stats.pct) + ". " : "Corporate bond prices were mixed. ";
  copy += "HYG closed at $" + f(high.stats.last) + " and LQD at $" + f(ig.stats.last) + ".";
  if (dispatchPeriodsMatch(loans,high)) copy += " Floating-rate loans " + dispatchVerb(loans.stats.pct) + " (" + pct(loans.stats.pct) + "), giving a shorter-duration credit comparison.";
  copy += " Coupon income and duration differences matter when translating these price moves into a credit view.";
  return [headline, copy];
}

function dispatchFx(rows) {
  const index = byId.get("dxy");
  if (!index || !Number.isFinite(index.stats.pct)) return dispatchFallback(rows);
  const quotes = rows.filter(r => r.id !== "dxy" && dispatchPeriodsMatch(r,index) && r.stats.last > 0);
  if (!quotes.length) return dispatchFallback(rows);
  // Measure the USD move as units of each peer currency per dollar.
  // EUR/USD and GBP/USD require the return on the reciprocal price.
  const peers = {eurusd:"euro",gbpusd:"pound",usdjpy:"yen",usdchf:"Swiss franc"};
  const changes = quotes.map(r => ({r, usd:r.id.startsWith("usd") ? r.stats.pct : -100*r.stats.pct/(100+r.stats.pct)}));
  const up = changes.filter(c => c.usd > 0).length, down = changes.filter(c => c.usd < 0).length;
  const breadth = changes.length === 4 ? "all four tracked peers" : changes.length === 1 ? "the " + peers[changes[0].r.id] : changes.length + " reporting peers";
  const headline = up === changes.length ? "Dollar gains against " + breadth
    : down === changes.length ? "Dollar falls against " + breadth : "Dollar pairs give a mixed reading";
  const largest = changes.reduce((a,b) => Math.abs(a.usd) >= Math.abs(b.usd) ? a : b);
  const copy = "The dollar index " + dispatchVerb(index.stats.pct) + " (" + pct(index.stats.pct) + ") to " + f(index.stats.last) + ". The biggest bilateral move was against the " + peers[largest.r.id] + ", where one US dollar bought " + (Math.abs(largest.usd) < .005 ? "roughly the same amount of currency." : f(Math.abs(largest.usd)) + "% " + (largest.usd > 0 ? "more" : "less") + " currency than at the previous close.");
  return [headline, copy];
}

function dispatchCommodities(rows) {
  const oil = byId.get("wti"), copper = byId.get("copper"), gold = byId.get("gold");
  if (dispatchGap(oil,copper) === null || !oil.contract) return dispatchFallback(rows);
  const opposite = oil.stats.pct*copper.stats.pct < 0;
  const headline = opposite
    ? (oil.stats.pct > 0 ? "Crude advances as copper retreats" : "Copper advances as crude retreats")
    : dispatchComparison("WTI crude",oil.stats.pct-copper.stats.pct,"copper");
  let copy = "The " + oil.contract + " WTI contract " + dispatchVerb(oil.stats.pct) + " " + (oil.stats.change === 0 ? "at " : "$" + f(Math.abs(oil.stats.change)) + " a barrel to ") + "$" + f(oil.stats.last) + ". Copper finished " + pct(copper.stats.pct) + ".";
  if (dispatchPeriodsMatch(gold,oil)) {
    const metals = copper.stats.pct*gold.stats.pct > 0;
    copy += " Gold " + dispatchVerb(gold.stats.pct) + " (" + pct(gold.stats.pct) + ")";
    copy += metals && opposite ? ", leaving both metals on the other side of the oil move." : metals ? ", moving in the same direction as copper." : ".";
  }
  return [headline, copy];
}

function dispatchAlternatives(rows) {
  const spy = byId.get("spy"), managed = byId.get("dbmf"), re = byId.get("vnq"), infra = byId.get("igf");
  if (dispatchGap(managed,spy) === null) return dispatchFallback(rows);
  const opposing = managed.stats.pct * spy.stats.pct < 0;
  const headline = opposing ? "Managed futures " + (managed.stats.pct > 0 ? "gain as US equities fall" : "fall as US equities gain") : dispatchComparison("DBMF", managed.stats.pct-spy.stats.pct, "US large caps");
  let copy = "DBMF " + dispatchVerb(managed.stats.pct) + " (" + pct(managed.stats.pct) + ") against " + pct(spy.stats.pct) + " for SPY.";
  const gap = dispatchGap(infra,re);
  if (gap !== null) copy += " Among listed real assets, infrastructure " + (Math.abs(gap) < .005 ? "matched property." : (gap > 0 ? "led" : "trailed") + " property by " + f(Math.abs(gap)) + " percentage points.");
  const longer = dispatchGap(managed,spy,"six");
  if (longer !== null && Math.abs(longer) >= .005) copy += " Over six months, DBMF " + (longer > 0 ? "leads" : "lags") + " SPY by " + f(Math.abs(longer)) + " percentage points on price.";
  return [headline, copy];
}

function dispatchTable(rows, isYield, label) {
  const body = rows.map(r => {
    const s = r.stats, detail = [r.contract || "", shortDate(s.day)].filter(Boolean).join(" · ");
    const precision = dispatchPrecision(r);
    const target = r.yield ? 'data-rates="1"' : 'data-focus="' + esc(r.id) + '"';
    const move = r.yield ? sf(s.change,0) + " bp" : pct(s.pct);
    const trend = !Number.isFinite(s.six) ? "—" : r.yield ? sf(s.six,0) + " bp" : pct(s.six);
    const absolute = r.yield ? "" : '<small>' + sf(s.change,precision) + '</small>';
    return '<tr><th scope="row"><button ' + target + '>' + esc(r.name) + '</button><small>' + esc(detail) + '</small></th>'
      + '<td>' + f(s.last,precision) + '<small>' + esc(r.unit) + '</small></td>'
      + '<td title="' + esc(s.previous_day+" to "+s.day) + '" class="' + (r.yield ? "" : cls(s.pct)) + '">' + move + absolute + '</td>'
      + '<td title="' + esc(s.base ? s.base+" to "+s.day : "Six months of history unavailable") + '" class="' + (r.yield ? "" : cls(s.six)) + '">' + trend + '</td></tr>';
  }).join("");
  return '<div class="dispatch-tablewrap"><table class="dispatch-table" aria-label="' + esc(label) + ' closing observations"><thead><tr><th scope="col">Market</th><th scope="col">' + (isYield ? "Yield" : "Close") + '</th><th scope="col">Session</th><th scope="col">6 months</th></tr></thead><tbody>' + body + '</tbody></table></div>';
}

function marketDispatches() {
  const specs = [
    ["americas","Americas",["spx","ixic","dji","rut","tsx"],dispatchAmericas,"US and Canadian cash indices in local index points."],
    ["europe","Europe",["stoxx50","ftse"],dispatchEurope,"Euro area and UK indices in local currency. An unhedged dollar investor also has FX exposure."],

    ["rates","Sovereign rates",[],dispatchRates,"US nominal constant-maturity yields. Both changes are in basis points."],
    ["credit","Credit",["hyg","lqd","bkln","emb","mbb","mub"],dispatchCredit,"USD credit ETF prices exclude distributions. Credit spreads and carry require separate measures."],
    ["fx","Currencies",["dxy","eurusd","usdjpy","gbpusd","usdchf"],dispatchFx,"Spot pairs use the displayed quote order. The dollar index is quoted in index points."],
    ["commodities","Commodities",["wti","brent","natgas","copper","gold","silver","corn"],dispatchCommodities,"Vendor closes for the indicated delivery months. Six-month changes follow the same individual contract."],
    ["alternatives","Alternatives",["dbmf","vnq","igf","gld","btc"],dispatchAlternatives,"Listed funds use USD price changes. Bitcoin uses the UTC daily spot close."]
  ];
  const cards = specs.map(([id,label,ids,narrative,basis]) => {

    const [headline, copy] = narrative(rows);

}

// Rank a move against the instrument's own history. Each desk can win one slot.
const pulseDesks = [
  ["US equities", ["spx", "ixic", "rut", "dji"]],
  ["International equities", ["stoxx50", "ftse", "nikkei", "nifty", "hsi", "tsx", "eem", "efa"]],
  ["Rates & credit", ["yield2", "yield10", "shy", "ief", "tlt", "hyg", "lqd", "mub", "emb", "mbb", "bkln", "tip"]],
  ["Currencies", ["eurusd", "gbpusd", "usdjpy", "usdchf", "dxy"]],
  ["Commodities", ["wti", "brent", "gold", "copper", "silver", "corn", "natgas"]],
  ["Alternatives", ["vnq", "igf", "dbmf", "btc", "vix"]]
];
function pulseRecord(row) {
  if (!row || row.history.length < 62) return null;
  const values = [];
  for (let i = row.history.length - 61; i < row.history.length; i++) {
    const [a, start] = row.history[i - 1], [b, end] = row.history[i];
    if (!Number.isFinite(start) || !Number.isFinite(end) || (!row.yield && start <= 0) || (Date.parse(b) - Date.parse(a)) / 864e5 > 5) return null;
    values.push(row.yield ? 100 * (end - start) : 100 * (end / start - 1));
  }
  const move = values.pop(), magnitude = Math.abs(move);
  // Prices used for ranking retain their source precision.
  const smaller = values.filter(v => Math.abs(v) < magnitude - 1e-8).length;
  return {row, move, smaller};
}
function pulseSelection() {
  const cutoff = Date.parse(E.created.slice(0, 10));
  const compare = (a, b) => b.smaller - a.smaller || b.row.stats.day.localeCompare(a.row.stats.day) || a.row.name.localeCompare(b.row.name);
  return pulseDesks.flatMap(([desk, ids]) => {
    const candidates = ids.map(marketQuote).filter(row => row && cutoff-Date.parse(row.stats.day) <= 4*864e5)
      .map(pulseRecord).filter(Boolean).sort(compare);
    return candidates.length ? [{...candidates[0], desk}] : [];
  }).sort(compare).slice(0,3);
}
const pulsePicks = pulseSelection();
function pulseChart(row) {
  const values = row.history.slice(-22), series = values.map(p => p[1]);
  const low = Math.min(...series), high = Math.max(...series);
  const first = Date.parse(values[0][0]), last = Date.parse(values.at(-1)[0]);
  const y = v => high === low ? 27 : 48 - (v-low)/(high-low)*42;
  const coords = values.map(([d,v]) => [(4+226*(Date.parse(d)-first)/(last-first)).toFixed(1), y(v).toFixed(1)]);
  const points = coords.map(p=>p.join(",")).join(" "), channel = series.at(-1) >= series[0] ? "#287961" : "#ad594e";
  const end = coords.at(-1);
  return '<figure class="pulse-chart"><svg viewBox="0 0 300 55" role="img" aria-label="'+esc(row.name+' last 22 closes, low '+f(low,dispatchPrecision(row))+' and high '+f(high,dispatchPrecision(row))+' '+row.unit)+'">'+
    '<path d="M4 6H230 M4 48H230" fill="none" stroke="#dbe1d9" stroke-dasharray="3 3"/><polygon points="4,50 '+points+' 230,50" fill="'+channel+'" opacity=".06"/>'+
    '<polyline points="'+points+'" fill="none" stroke="'+channel+'" stroke-width="2"/><circle cx="'+end[0]+'" cy="'+end[1]+'" r="2.8" fill="'+channel+'"/>'+
    '<g fill="#5b6d68" font-size="10" font-family="monospace"><text x="295" y="11" text-anchor="end">'+f(high,dispatchPrecision(row))+'</text><text x="295" y="50" text-anchor="end">'+f(low,dispatchPrecision(row))+'</text></g></svg>'+
    '<figcaption><span>'+shortDate(values[0][0])+'</span><span>'+shortDate(values.at(-1)[0])+' · '+esc(row.unit)+'</span></figcaption></figure>';
}
function activeCharts() {
  const cards = pulsePicks.map(({row, smaller, desk}) =>
    '<article class="pulse-card"><div class="pulse-desk">'+esc(desk)+'</div><h3><button '+quoteTarget(row)+'>'+esc(row.name)+' <span aria-hidden="true">↗</span></button></h3>'+
    '<div class="pulse-number"><b>'+f(row.stats.last,dispatchPrecision(row))+(row.yield?'%':'')+'</b><span class="'+cls(row.stats.change)+'">'+(row.yield?dailyMove(row):pct(row.stats.pct))+'</span></div>'+
    pulseChart(row)+'<p>The '+shortDate(row.stats.day)+' move exceeded <b>'+smaller+' of the prior 60</b> daily moves in magnitude.</p></article>').join('');
  if (!cards) return '';
  return '<section id="active-charts" class="pulse-section"><div class="edition-section"><div><h2>Moves in focus</h2><p>Which markets moved furthest relative to their own recent trading?</p></div>'+
    '<span class="section-meta">60-observation lookback</span></div><div class="pulse-grid">'+cards+'</div>'+
    '<details class="pulse-method"><summary>How markets are selected</summary><p>We compare the absolute one-session percentage change with the preceding 60 absolute changes in the same series. Treasury yields use basis points. The three highest counts across distinct desks are shown. Ties favor the newer observation, then the instrument name. Closes more than four calendar days old and histories with breaks over five days are excluded. A 22-close chart shows the price or yield path.</p></details></section>';
}

const thesisPairs = [

  {id:"efa", sleeve:"Developed ex-US equity", label:"Developed ex-US equities", question:"How much did developed overseas markets move with US stocks?"}
];
const thesisDefaultPair = {saa:"tlt", certain:"tip", endowment:"igf", daa:"eem", alpha:"dbmf"};

function thesisReturns(row) {
  const daily = new Map();
  const history = row?.history || [];
  for (let i = 1; i < history.length; i++) {
    const [start, first] = history[i-1], [end, last] = history[i];
    const gap = (Date.parse(end) - Date.parse(start)) / 864e5;
    if (gap > 0 && gap <= 5 && Number.isFinite(first) && first > 0 && Number.isFinite(last) && last > 0) {
      daily.set(start + "/" + end, last / first - 1);
    }
  }
  return daily;
}

function thesisMatched(left, right) {
  const matched = [], other = thesisReturns(right);
  for (const [interval, x] of thesisReturns(left)) {
    if (other.has(interval)) matched.push({day:interval.split("/")[1], x, y:other.get(interval)});
  }
  return matched;
}

function thesisCorrelation(rows) {
  if (rows.length < 2 || rows.every(r=>r.x===rows[0].x) || rows.every(r=>r.y===rows[0].y)) return null;
  const mx = rows.reduce((sum, r) => sum + r.x, 0) / rows.length;
  const my = rows.reduce((sum, r) => sum + r.y, 0) / rows.length;
  let xx = 0, yy = 0, xy = 0;
  for (const row of rows) {
    const x = row.x - mx, y = row.y - my;
    xx += x*x;
    yy += y*y;
    xy += x*y;
  }
  return xx && yy ? Math.min(1, Math.max(-1, xy / Math.sqrt(xx*yy))) : null;
}

function thesisSeries(matched) {
  const series = [];
  // Keep windows with undefined correlation so the chart breaks at that date.
  for (let i = Math.max(62,matched.length-127); i < matched.length; i++) {
    series.push({day:matched[i].day, value:thesisCorrelation(matched.slice(i-62,i+1))});
  }
  return series;
}

function thesisHistoryChart(series, symbol) {
  if (series.length < 2 || series.filter(point=>point.value!=null).length < 2) return "";
  const start = Date.parse(series[0].day), end = Date.parse(series.at(-1).day);
  if (start >= end) return "";
  const X = day => 32 + 390*(Date.parse(day)-start)/(end-start);
  const Y = val => 55 - val*43;
  let curve = "", liftPen = true;
  for (const point of series) {
    if (point.value == null) { liftPen = true; continue; }
    curve += (liftPen ? "M" : "L") + X(point.day).toFixed(1) + " " + Y(point.value).toFixed(1);
    liftPen = false;
  }
  const last = series.at(-1);
  const endpoint = last.value == null ? "" : '<circle cx="422" cy="'+Y(last.value)+'" r="3.5" fill="#176e68"/>';
  return '<figure class="thesis-chart"><figcaption>Rolling 63-session correlation · SPY / '+esc(symbol)+'</figcaption>'+
    '<svg role="img" aria-label="Rolling correlation from '+esc(series[0].day)+' to '+esc(last.day)+'" viewBox="0 0 432 125" width="100%">'+
    '<g fill="#536776" font-size="10" font-family="sans-serif">'+
    '<path d="M32 12H422 M32 98H422" stroke="#d9e1df"/><path d="M32 55H422" stroke="#98aca6" stroke-dasharray="3 3"/>'+
    '<text x="23" y="16" text-anchor="end">+1</text><text x="23" y="59" text-anchor="end">0</text><text x="23" y="102" text-anchor="end">−1</text>'+
    '<text x="32" y="119">'+esc(shortDate(series[0].day))+'</text><text x="422" y="119" text-anchor="end">'+esc(shortDate(last.day))+'</text></g>'+
    '<path d="'+curve+'" fill="none" stroke="#176e68" stroke-width="2" stroke-linejoin="round"/>'+endpoint+'</svg></figure>';
}

function thesisMetrics(items) {
  return '<dl class="thesis-metrics">'+items.map(([label,val])=>'<div><dt>'+esc(label)+'</dt><dd>'+esc(val)+'</dd></div>').join("")+'</dl>';
}

function thesisEvidence(pair, choices) {
  if (!pair) return '<p class="empty">No covered price pair for the sleeves in this edition.</p>';
  const row = byId.get(pair.id), anchor = byId.get("spy");
  const control = '<label class="thesis-choice">Market lens <select id="thesisPair">'+choices.map(p=>option(p.id,p.label,pair.id)).join("")+'</select></label>';
  const title = '<div class="thesis-subhead"><h3>'+esc(pair.question)+'</h3>'+control+'</div>';
  const matched = thesisMatched(anchor,row);
  if (matched.length < 63) return title+'<p class="empty">Only '+matched.length+' matched daily returns available. This lens needs 63.</p>';
  const series = thesisSeries(matched), current = series.at(-1), window = matched.slice(-63);
  const previous = matched.length >= 126 ? thesisCorrelation(matched.slice(-126,-63)) : null;
  const losses = window.filter(r=>r.x<0);
  const offsets = losses.filter(r=>r.y>0).length;
  const priorShift = previous == null || current.value == null ? null : current.value - previous;
  const date = dateLabel(current.day);
  const age = (Date.parse(E.created.slice(0,10)) - Date.parse(current.day)) / 864e5;
  const vintage = age > 7 ? ' This reading is '+age+' calendar days behind the edition.' : '';
  const movement = current.value == null ? "This window has no variation in at least one return series." :
    Math.abs(current.value)<.20 ? "The two price series showed little linear co-movement across these sessions." :
    current.value>0 ? "Their daily price returns tended to move together." : "Their daily price returns tended to move in opposite directions.";
  const downside = losses.length
    ? row.symbol+' gained on '+offsets+' of the '+losses.length+' sessions when SPY fell.'
    : 'SPY had no down sessions in this window.';
  const downsideReturns = losses.length ? " Across those down sessions, SPY averaged "+pct(100*losses.reduce((n,r)=>n+r.x,0)/losses.length)+" and "+row.symbol+" averaged "+pct(100*losses.reduce((n,r)=>n+r.y,0)/losses.length)+"." : "";
  return title+
    '<p class="mini thesis-asof">Price evidence through '+esc(date)+esc(vintage)+'</p>'+
    thesisMetrics([["63-session correlation",sf(current.value)],["Prior 63 sessions",sf(previous)],["Difference",sf(priorShift)]])+
    '<p class="thesis-reading">'+esc(movement+' '+downside+downsideReturns)+'</p>'+thesisHistoryChart(series,row.symbol)+
    '<details class="thesis-method"><summary>Dates and calculation</summary><p>SPY represents US equities. '+esc(row.symbol)+' represents '+esc(pair.label.toLowerCase())+
    '. Each point is a Pearson correlation of 63 daily ETF price returns with identical start and end close dates. Values between −0.20 and +0.20 are described here as weak co-movement. The comparison uses the preceding 63 non-overlapping returns. '+
    'This window ends '+esc(current.day)+' and starts with the return ending '+esc(window[0].day)+'. Distributions are excluded. The down-day count measures frequency alone.</p></details>';
}

function overviewTheses() {
  const books = Object.entries(E.books || {}).filter(([,b])=>b && typeof b==="object");
  const header = '<div class="panel-head"><h2>Portfolio thesis &amp; cross-market evidence</h2><a href="#portfolio" data-open-book="'+esc(thesisBookId)+'">Portfolio monitor ↗</a></div>';
  if (!books.length) return '<section id="portfolio-brief" class="home-panel thesis-panel">'+header+'<p class="empty">No published portfolio snapshot in this edition.</p></section>';
  const [key,b] = books.find(([id])=>id===thesisBookId) || books[0];
  const sleeves = b.sleeves || [];
  const choices = thesisPairs.filter(p=>byId.has("spy") && byId.has(p.id) && sleeves.some(s=>s.sleeve===p.sleeve && s.capital>0));
  const pair = choices.find(p=>p.id===(thesisPairId || thesisDefaultPair[key])) || choices[0];
  const top = sleeves.filter(s=>Number.isFinite(s.risk) && Number.isFinite(s.capital)).sort((a,b)=>b.risk-a.risk)[0];
  const related = pair && sleeves.find(s=>s.sleeve===pair.sleeve);
  const metrics = [
    ["Published stance",b.stance || "—"],
    ["Forecast volatility",Number.isFinite(b.forecast)?f(b.forecast,1)+"%":"—"],
    ["Construction vol. cap",Number.isFinite(b.budget)?f(b.budget,1)+"%":"—"]
  ];
  const bookAge = (Date.parse(E.created.slice(0,10)) - Date.parse(b.date)) / 864e5;
  const bookDate = b.date ? dateLabel(b.date)+(bookAge>7?" · "+bookAge+" calendar days before this edition":"") : "Date unavailable";
  const concentration = top ? top.sleeve+' accounts for '+f(top.risk,1)+'% of modeled portfolio risk on '+f(top.capital,1)+'% of capital.' : "";
  const lensWeight = related && related!==top ? ' The '+pair.label.toLowerCase()+' sleeve has a '+f(related.capital,1)+'% capital weight.' : "";
  return '<section id="portfolio-brief" class="home-panel thesis-panel">'+header+
    '<div class="thesis-layout"><article class="thesis-book"><div class="thesis-subhead"><h3>'+esc(b.name)+' investment thesis</h3>'+
    '<label class="thesis-choice">Book <select id="thesisBook">'+books.map(([id,book])=>option(id,book.name,key)).join("")+'</select></label></div>'+
    '<p class="mini thesis-asof">Published positioning · '+esc(bookDate)+'</p>'+
    (b.thesis ? '<blockquote class="thesis-published">'+esc(b.thesis)+'</blockquote>' : '<p class="empty">Thesis text unavailable for this book.</p>')+
    thesisMetrics(metrics)+'<p class="thesis-reading">'+esc(concentration+lensWeight)+'</p>'+
    (b.url?'<a class="link" href="'+esc(b.url)+'">Published portfolio book ↗</a>':'')+'</article>'+
    '<article class="thesis-evidence">'+thesisEvidence(pair, choices)+'</article></div></section>';
}

function thesisControls(event) {
  const {id,value} = event.target;
  if (id !== "thesisBook" && id !== "thesisPair") return false;
  if (id === "thesisBook") { thesisBookId = value; thesisPairId = ""; }

function pmChart(rows, underwater) {
  const width=580, height=174, x0=50, x1=568, y0=9, y1=145;
  const values=rows.flatMap(r=>underwater?[r.dd]:[r.nav,r.ref]).filter(Number.isFinite);
  if (values.length<2 || rows.length<2) return '<p class="empty">Awaiting two dated NAV closes.</p>';
  const min=Math.min(...values), max=Math.max(...values);
  const pad=Math.max((max-min)*.08, underwater?.02:.03);
  const low=min-pad, high=underwater?0:max+pad;
  const first=Date.parse(rows[0].day), span=Math.max(1,Date.parse(rows.at(-1).day)-first);
  const X=r=>x0+(x1-x0)*(Date.parse(r.day)-first)/span;
  const Y=n=>y1-(n-low)/(high-low)*(y1-y0);
  const path=field=>{
    let result="", next="M";
    for (const r of rows) {
      if (!Number.isFinite(r[field])) { next="M"; continue; }
      result+=next+X(r).toFixed(2)+" "+Y(r[field]).toFixed(2);
      next="L";
    }
    return result;
  };
  const primary=path(underwater?"dd":"nav");
  let content="";
  for (let i=0;i<4;i++) {
    const v=low+(high-low)*i/3;
    content+='<path d="M'+x0+' '+Y(v)+'H'+x1+'" stroke="#dce5e7" stroke-width=".8"/><text x="'+(x0-7)+'" y="'+(Y(v)+3.5)+'" text-anchor="end">'+f(v,underwater?1:2)+(underwater?'%':'')+'</text>';
  }
  if (underwater) {
    content+='<path d="'+primary+' L'+x1+' '+Y(0)+' L'+x0+' '+Y(0)+' Z" fill="#ba7860" opacity=".17"/>';
  } else {
    content+='<path d="'+path("ref")+'" stroke="#6c62b2" stroke-dasharray="5 3" stroke-width="2" fill="none"/>';
  }
  content+='<path d="'+primary+'" stroke="'+(underwater?'#a7533d':'#07766d')+'" stroke-width="2.8" stroke-linejoin="round" fill="none"/>';
  [rows[0],rows[Math.floor((rows.length-1)/2)],rows.at(-1)].forEach((r,i)=>{
    content+='<text x="'+X(r)+'" y="167" text-anchor="'+(["start","middle","end"][i])+'">'+esc(shortDate(r.day))+'</text>';
  });
  return '<svg viewBox="0 0 '+width+' '+height+'" role="img" aria-label="'+(underwater?'Percentage below the running NAV peak':'Fund and reference NAV indices')+' from '+esc(rows[0].day)+' through '+esc(rows.at(-1).day)+'">'+content+'</svg>';
}

function pmSelect(id, caption, options) {
  return '<label class="pm-select">'+esc(caption)+'<select id="'+id+'">'+options+'</select></label>';
}

function pmCharts(b, details) {
  const history=details.history;
  let peak=details.initial;
  const full=history.map(r=>{
    peak=Math.max(peak,r.nav);
    return {...r,dd:100*(r.nav/peak-1)};
  });
  const periods=[["ALL","Since inception"],["3M","3 months"],["1M","1 month"]];
  const end=new Date(full.at(-1).day+"T00:00:00Z");
  const months=pmHorizon==="1M"?1:pmHorizon==="3M"?3:0;
  const boundary=new Date(Date.UTC(end.getUTCFullYear(),end.getUTCMonth()-months,1));
  const daysInMonth=new Date(Date.UTC(boundary.getUTCFullYear(),boundary.getUTCMonth()+1,0)).getUTCDate();
  boundary.setUTCDate(Math.min(end.getUTCDate(),daysInMonth));
  const range=boundary.toISOString().slice(0,10);
  const rows=months?full.filter(r=>r.day>=range):full;
  const min=Math.min(...full.map(r=>r.dd));
  const control=pmSelect("pmHorizon","History window",periods.map(([k,v])=>option(k,v,pmHorizon)).join(""));
  const legend='<span class="pm-key"><i></i>'+esc(b.name)+'</span><span class="pm-key ref"><i></i>'+esc(details.benchmark)+'</span>';
  return '<section class="pm-card pm-track">'+pmHeader("Performance and drawdown","Forward-tracked NAV · "+pmDate(full[0].day)+' – '+pmDate(full.at(-1).day),control)+
    '<div class="pm-plots"><figure><figcaption>NAV index <span>'+legend+'</span></figcaption>'+pmChart(rows,false)+
    '<p>Starting capital '+f(details.initial,0)+'. Fund NAV includes accrued costs.</p></figure>'+
    '<figure><figcaption>Underwater curve <span>Worst drawdown '+pmSigned(min,2,"%")+'</span></figcaption>'+pmChart(rows,true)+
    '<p>Distance below the fund’s running peak since inception, including its starting capital.</p></figure></div></section>';
}

function pmExposure(b) {

  const top=sleeves[0], blocks=b.blocks||[];

  const concentration=top?top.sleeve+' carries '+f(top.risk,1)+'% of estimated risk on '+f(top.capital,1)+'% of model capital.':'Risk contributions unavailable.';
  const exposure='<section class="pm-card">'+pmHeader("Policy allocation","Model capital by block · "+pmDate(b.date))+
    bar+'<ul class="pm-blocks">'+list+'</ul><p class="pm-thesis">'+esc(b.thesis || "No thesis published for this book.")+'</p>'+

  const risk='<section class="pm-card">'+pmHeader("Risk concentration","Modeled contributions · "+pmDate(b.date))+'<p class="pm-reading">'+esc(concentration)+'</p>'+
    '<div class="pm-scroll"><table><thead><tr><th>Sleeve</th><th>Capital</th><th>Risk share</th><th>Risk − capital</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>';
  return '<div class="pm-grid">'+exposure+risk+'</div>';
}

function pmMarketDetails(live) {
  if (!live?.dates?.length || !Array.isArray(live.nav) || !Number.isFinite(live.opening) || live.opening<=0) return null;
  const history=live.dates.map((day,i)=>({day,nav:live.nav[i],ref:live.benchmark_nav?.[i]}))

function pmReview(b,live) {
  const portfolio=live.returns?.SI, reference=live.benchmark_returns?.SI;
  const active=Number.isFinite(portfolio) && Number.isFinite(reference)?portfolio-reference:null;
  const m=b.risk_model || {};
  const performance=[];
  if (Number.isFinite(live.drawdown_pct)) performance.push('NAV is '+f(Math.abs(live.drawdown_pct),2)+'% below its high-water mark.');
  if (active!=null) {
    performance.push('Since '+pmDate(live.inception)+', '+b.name+' returned '+pmSigned(portfolio,2,"%")+' against '+pmSigned(reference,2,"%")+' for '+live.benchmark+
      ', '+(Math.abs(active)<.00005?'matching its reference.':(active>0?'ahead by ':'behind by ')+f(Math.abs(active)*100,1)+' bp.'));
  }
  if (Number.isFinite(m.dd_limit) && Number.isFinite(live.drawdown_pct)) {
    const distance=live.drawdown_pct-m.dd_limit;
    performance.push('Its drawdown stands '+f(Math.abs(distance),2)+' percentage points '+(distance>=0?'above':'below')+' the '+pmSigned(m.dd_limit,1,"%")+' owner loss limit.');
  }
  const factors=(m.factors||[]).filter(r=>Number.isFinite(r.share)).sort((a,z)=>z.share-a.share);
  const risk=[];
  if (factors.length) risk.push(factors[0].factor+' represents '+f(factors[0].share,1)+'% of modeled portfolio risk.');
  if (Number.isFinite(b.forecast) && Number.isFinite(b.budget)) risk.push('Forecast annualized volatility is '+f(b.forecast,1)+'% against a '+f(b.budget,1)+'% construction cap.');
  const largest=(b.sleeves||[]).filter(r=>Number.isFinite(r.risk) && Number.isFinite(r.capital)).sort((a,z)=>z.risk-a.risk)[0];
  if (largest) risk.push(largest.sleeve+' is the largest sleeve risk contribution, '+f(largest.risk,1)+'% on '+f(largest.capital,1)+'% of model capital.');
  if (!performance.length && !risk.length) return "";
  return '<section class="pm-review-note"><h3>PM review</h3><div>'+
    (performance.length?'<p>'+esc(performance.join(" "))+'</p>':'')+
    (risk.length?'<p>'+esc(risk.join(" "))+' <span>Risk model dated '+esc(pmDate(b.date))+'.</span></p>':'')+'</div></section>';
}

function pmHoldings(live) {

function pmCompleted(live) {
  const latest=live.session || {};
  const session=latest.holding_moves?.length ? latest : live.completed_session;
  if (!session?.holding_moves?.length || !session.start || !session.end) return "";
  const moves=session.holding_moves.filter(r=>Number.isFinite(r.points)).sort((a,b)=>b.points-a.points);
  const scale=Math.max(.000001,...moves.map(r=>Math.abs(r.points)));
  const bars=moves.map(r=>{
    const size=48*Math.abs(r.points)/scale;
    const left=r.points>=0?50:50-size;
    return '<li><span>'+esc(r.ticker)+'</span><i aria-hidden="true"><em style="left:'+left.toFixed(3)+'%;width:'+size.toFixed(3)+'%;background:'+(r.points>=0?'#168372':'#b45a42')+'"></em></i><b class="'+cls(r.points)+'">'+pmSigned(r.points,4)+'</b></li>';
  }).join("");
  const largest=moves.find(r=>r.points>0), weakest=moves.filter(r=>r.points<0).at(-1);
  const story=[
    largest?largest.ticker+' contributed '+f(largest.points,4)+' points.':"",
    weakest?weakest.ticker+' cost '+f(-weakest.points,4)+' points.':""
  ].filter(Boolean).join(" ");
  return '<section class="pm-card pm-completed">'+pmHeader("Completed-session contributors",pmDate(session.start)+' → '+pmDate(session.end)+' · NAV points')+
    '<div class="pm-grid"><div><p class="pm-reading">'+esc(story)+'</p><ul class="pm-contributors">'+bars+'</ul></div><div><h3>Reconciled session</h3>'+
    '<div class="pm-cashlist">'+pmCashRow("Vehicle estimates",moves.reduce((sum,r)=>sum+r.points,0))+
    pmCashRow("Fee · estimated",session.fee)+pmCashRow("Dealing · estimated",session.dealing)+pmCashRow("Balance / rounding",session.residual)+
    pmCashRow("Published NAV change",session.net,true)+'</div><p class="pm-foot">'+esc(session.basis || "Reconstructed from published holdings and adjusted ETF prices.")+'</p></div></div></section>';
}

function pmCashRow(label,value,strong=false) {
  return '<div class="pm-cashrow'+(strong?' total':'')+'"><span>'+esc(label)+'</span><b class="'+(Number.isFinite(value)?cls(value):"")+'">'+pmSigned(value,4)+'</b></div>';
}

function pmBridge(live) {
  const s=live.session||{}, matches=s.end===live.date && !!s.start;
  const start=s.start?pmDate(s.start):"Prior close";
  const sub=matches?start+' → '+pmDate(s.end)+' · NAV points':'Daily components unavailable for this valuation';
  const moves=matches?(s.holding_moves||[]).filter(r=>Number.isFinite(r.points)).sort((a,b)=>Math.abs(b.points)-Math.abs(a.points)):[];
  let daily='<p class="empty">Daily attribution unavailable in this edition.</p>';
  if (matches) {
    daily='<div class="pm-cashlist">'+pmCashRow("Gross investment move · inferred",s.gross)+pmCashRow("Management fee · estimated",s.fee)+pmCashRow("Dealing · estimated",s.dealing)+pmCashRow("Net change in NAV",s.net,true)+'</div>';
    if (moves.length) {
      const sum=moves.reduce((t,r)=>t+r.points,0);
      daily+='<details class="pm-more"><summary>Daily vehicle estimates</summary><div class="pm-cashlist">'+
        moves.map(r=>pmCashRow(r.ticker,r.points)).join("")+
        pmCashRow("Gross less listed estimates",Number.isFinite(s.gross)?s.gross-sum:null,true)+'</div></details>';
    }
    if (s.basis) daily+='<p class="pm-foot">'+esc(s.basis)+'</p>';
  }
  const bridge=live.bridge||{}, vehicle=Object.entries(bridge.vehicles||{}).filter(([,v])=>Number.isFinite(v)).sort((a,b)=>b[1]-a[1]);
  const largestGain=vehicle.find(([,n])=>n>0), largestLoss=vehicle.filter(([,n])=>n<0).at(-1);
  const observations=[
    largestGain?largestGain[0]+' added '+f(largestGain[1],3)+' NAV points.':null,
    largestLoss?largestLoss[0]+' detracted '+f(-largestLoss[1],3)+' points.':null
  ].filter(Boolean).join(" ");
  let record="";
  if (Number.isFinite(bridge.total)) {
    const gross=vehicle.reduce((acc,[,v])=>acc+v,0);
    const residual=[bridge.fee,bridge.dealing].every(Number.isFinite) && vehicle.length?bridge.total-gross-bridge.fee-bridge.dealing:null;
    record='<div class="pm-bridge-history"><h3>Since-inception contributors</h3><span class="mini">'+esc(pmDate(live.inception))+' – '+esc(pmDate(live.date))+' · NAV points</span><p>'+esc(observations)+'</p>'+
      '<details class="pm-more"><summary>Inspect cumulative bridge</summary><div class="pm-cashlist">'+vehicle.map(([label,v])=>pmCashRow(label,v)).join("")+
      pmCashRow("Management fees",bridge.fee)+pmCashRow("Dealing costs",bridge.dealing)+pmCashRow("Balance / rounding",residual)+pmCashRow("Net NAV change",bridge.total,true)+'</div></details></div>';
  }
    const factor=live.factor_attribution;
  if (factor?.rows?.length) {
    const rows=factor.rows.filter(r=>Number.isFinite(r.points)).sort((a,b)=>Math.abs(b.points)-Math.abs(a.points));
    record+='<details class="pm-more pm-factor-detail"><summary>Modeled factor attribution since inception</summary>'+
      '<p class="pm-foot">'+esc(pmDate(live.inception))+' – '+esc(pmDate(live.date))+' · NAV points. Publisher factor model uses '+esc(typeof factor.window==="object" ? ((factor.window.beta_obs || "—")+" beta observations from "+(factor.window.beta_start || "—")) : (factor.window || "its disclosed estimation window"))+'.</p>'+
      '<div class="pm-cashlist">'+rows.map(r=>pmCashRow(r.name,r.points)).join("")+
      pmCashRow("Cash",factor.cash)+pmCashRow("Costs",factor.costs)+pmCashRow("Unexplained residual",factor.residual)+
      pmCashRow("Net NAV change",bridge.total,true)+'</div></details>';
  }
  return '<section class="pm-card">'+pmHeader("Daily valuation bridge",sub)+daily+record+'</section>';
}

function pmConstraints(model) {
  const caps=[
    ["Drawdown construction cap",model.dd_budget],
    ["Conditional drawdown-at-risk cap",model.cdar_cap]
  ].filter(([,v])=>Number.isFinite(v));
  if (Number.isFinite(model.dd_limit)) caps.push(["Owner loss limit",model.dd_limit]);
  const rows=(model.constraints||[]).map(c=>'<tr><th scope="row">'+esc(c.sleeve)+'</th><td>'+pmNumber(c.floor,1,"%")+'</td><td>'+pmNumber(c.current,1,"%")+'</td><td>'+pmNumber(c.ceiling,1,"%")+'</td></tr>').join("");
  return (caps.length?'<ul class="pm-blocks simple pm-caps">'+caps.map(([k,v])=>'<li><span>'+esc(k)+'</span><b>'+pmNumber(v,1,"%")+'</b></li>').join("")+'</ul>':'')+
    (rows?'<details class="pm-more"><summary>Inspect construction bounds</summary><div class="pm-scroll"><table><thead><tr><th>Sleeve</th><th>Floor</th><th>Model weight</th><th>Ceiling</th></tr></thead><tbody>'+rows+'</tbody></table></div></details>':'');
}

function pmStress(b) {
  const m=b.risk_model || {}, cases=(m.scenarios||[]).filter(s=>Number.isFinite(s.portfolio_pct)).sort((a,z)=>a.portfolio_pct-z.portfolio_pct);
  const factors=(m.factors||[]).filter(r=>Number.isFinite(r.share));
  const forecast=b.forecast,budget=b.budget,util=Number.isFinite(forecast)&&budget>0?100*forecast/budget:null;
  const distribution=factors.map(r=>'<li><span>'+esc(r.factor)+'</span><b>'+pmSigned(r.share,1,"%")+'</b></li>').join("");
  const risk='<section class="pm-card">'+pmHeader("Construction constraints","Published risk model · "+pmDate(b.date))+
    '<div class="pm-tiles compact">'+pmMetric("Forecast volatility",pmNumber(forecast,1,"%"),"Annualized")+
    pmMetric("Volatility cap",pmNumber(budget,1,"%"),"Construction constraint")+
    pmMetric("Cap utilization",pmNumber(util,0,"%"),"Forecast ÷ construction cap")+'</div>'+pmConstraints(m)+
    (factors.length?'<h3 class="pm-smallhead">Share of modeled risk</h3><ul class="pm-blocks simple">'+distribution+'</ul>':'')+
    (Number.isFinite(m.effective_bets)?'<p class="pm-foot">Model-implied effective bets '+pmNumber(m.effective_bets,1)+' · diversification ratio '+pmNumber(m.diversification_ratio,2)+'×.</p>':'')+'</section>';
  const worst=cases[0], selected=cases.find(s=>s.name===pmShock) || worst;
  if (!selected) return '<div class="pm-grid">'+risk+'<section class="pm-card">'+pmHeader("Scenario losses","Published shock analysis")+'<p class="empty">Scenario estimates unavailable in this edition.</p></section></div>';
  const select=pmSelect("pmShock","Inspect scenario",cases.map(s=>option(s.name,s.name,selected.name)).join(""));
  let comparison='';
  if (Number.isFinite(selected.policy_pct)) {
    comparison='<p>Against '+esc(m.scenario_reference || 'its policy weights')+' '+pmSigned(selected.policy_pct,1,"%")+' · difference '+pmSigned(selected.portfolio_pct-selected.policy_pct,1," pp")+'.</p>';
  }
  const bound=Math.max(.01,...cases.map(s=>Math.abs(s.portfolio_pct)));
  const ladder=cases.map(s=>'<li><span>'+esc(s.name)+'</span><i aria-hidden="true"><em style="width:'+f(Math.abs(s.portfolio_pct)/bound*100,2)+'%;background:'+(s.portfolio_pct<0?'#b86750':'#18786b')+'"></em></i><b>'+pmSigned(s.portfolio_pct,1,"%")+'</b></li>').join("");
  const shock='<section class="pm-card">'+pmHeader("Scenario losses","Hypothetical shocks to model weights · "+pmDate(b.date))+
    '<ul class="pm-scenarios">'+ladder+'</ul><div class="pm-stress-inspect">'+select+'<b>'+pmSigned(selected.portfolio_pct,1,"%")+'</b>'+comparison+'</div></section>';
  return '<div class="pm-grid">'+risk+shock+'</div>';
}

function freshnessTime(value) {
  const date = new Date(value);
  return Number.isFinite(date.valueOf()) ? date.toLocaleString("en-US", {
    timeZone:"America/New_York", month:"short", day:"numeric", hour:"numeric",
    minute:"2-digit", timeZoneName:"short"
  }) : "Unavailable";
}
function readerExpectedClose(now=new Date()) {
  const parts=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(now).map(p=>[p.type,p.value]));
  const calendar=E.refresh?.calendar || {}, day=parts.year+"-"+parts.month+"-"+parts.day;
  const early=(calendar.early_closes?.[parts.year] || "").split(" ").includes(day.slice(5));
  let date=new Date(day+"T12:00:00Z");
  if(Number(parts.hour)*60+Number(parts.minute)<(early?13:16)*60+10)date.setUTCDate(date.getUTCDate()-1);
  for(let i=0;i<10;i++) {
    const text=date.toISOString().slice(0,10), holidays=(calendar.holidays?.[text.slice(0,4)] || "").split(" ");
    if(![0,6].includes(date.getUTCDay())&&!holidays.includes(text.slice(5)))return text;
    date.setUTCDate(date.getUTCDate()-1);
  }
  return null;
}
function freshness(now = new Date()) {
  const schedule = E.refresh;
  if (!schedule) return '';
  const instants = schedule.targets.map(t=>new Date(t));
  const due = instants.filter(t=>t<=now).at(-1);
  const next = instants.find(t=>t>now);
  const missed = due && Date.parse(E.created)<due.valueOf();
  const delayed = missed && now-due>3600000;
  const close = byId.get("spx")?.stats.day;
  const expected=readerExpectedClose(now);
  const awaitingClose=close && expected && close<expected;
  const outcomes=typeof pipelineState!=="undefined" ? pipelineState.recent || [] : [];
  const failed=["refresh","pages"].some(kind=>(pipelineState.last_outcome?.[kind] || outcomes.find(r=>r.kind===kind&&r.status!=="skipped"))?.status==="failed");
  const label = failed ? "Pipeline failure · see reliability" : awaitingClose ? "Awaiting newer US close" : delayed ? "Refresh overdue" : missed ? "Refresh due" : "Collected";
  const families = [
    ["US equities", markets.filter(r=>r.group==="Indices").map(r=>r.stats.day)],
    ["Global equities", markets.filter(r=>r.group==="Global").map(r=>r.stats.day)],
    ["FX & futures", markets.filter(r=>["FX","Futures"].includes(r.group)).map(r=>r.stats.day)],
    ["Treasury yields", [curves.at(-1)?.date]],
    ["Portfolio NAV", Object.values(E.books||{}).map(b=>b.live?.date)],
    ["Confirmed macro", [E.macro?.date]]
  ];
  const dates = families.map(([name,days])=>{
    const sorted=days.filter(Boolean).sort();
    const range=sorted.length ? sorted[0]===sorted.at(-1) ? dateLabel(sorted[0]) : shortDate(sorted[0])+" – "+dateLabel(sorted.at(-1)) : "Awaiting source";
    return '<tr><th scope="row">'+name+'</th><td>'+esc(range)+'</td></tr>';
  }).join("");
  const history=schedule.recent.map(r=>'<li><span>'+esc(freshnessTime(r.created))+'</span><span>'+r.notes+' source notes</span>'+
    (r.url?'<a href="'+esc(r.url)+'">Run ↗</a>':'<span>Local refresh</span>')+'</li>').join("");
  return '<details id="cadence-details" class="freshness '+(delayed||awaitingClose||failed?'overdue':'')+'"><summary><span><i aria-hidden="true"></i><b>'+label+'</b> '+esc(freshnessTime(E.created))+
    ' · US close '+esc(close?shortDate(close):'unavailable')+'</span><span>'+(missed?'Target was '+freshnessTime(due):next?'Next target '+freshnessTime(next):'See daily schedule')+' <b class="freshness-more">Cadence &amp; sources ▾</b></span></summary>'+
    '<div class="freshness-body"><div><h3>Automatic daily refresh</h3><p>Weekdays at <b>'+esc(schedule.weekdays.join(", "))+'</b>. Weekends at <b>'+esc(schedule.weekends.join(", "))+
    '</b>. All times America/New_York, with daylight saving changes.</p><p>Checks every 15 minutes retry missed targets. Delayed US closing prices are retried hourly. Exchange holidays can retain the preceding close. GitHub may delay starts. The reader checks for a newer edition every five minutes and loads it automatically.</p><p>Benchmark cards may show a newer timestamped vendor session quote; analytics use completed daily bars. Portfolio valuations and the monthly macro model keep their own source dates.</p>'+
    '<a href="#pipeline">Refresh &amp; reliability →</a> · <a href="'+esc(schedule.workflow)+'">Refresh runs ↗</a> · <a href="'+repo+'/blob/main/CADENCE.md">Full edition ledger ↗</a></div>'+
    '<div><h3>Observation dates</h3><table>'+dates+'</table></div><div><h3>Recent refreshes</h3><ul>'+history+'</ul></div></div></details>';
}

async function checkNewEdition() {
  if (!["http:","https:"].includes(location.protocol)) return;
  try {
    const response=await fetch("status.json?check="+Date.now(), {cache:"no-store"});
    if (!response.ok) return;
    const status=await response.json();
    if (Date.parse(status.created)>Date.parse(E.created)) {
      try {sessionStorage.setItem("observatory-book",book)} catch {}
      const destination=new URL(location.href);
      destination.searchParams.set("edition",status.created);
      location.replace(destination.href);
    }
  } catch {}
}
if(typeof window.setInterval==="function") {
  try {
    const saved=sessionStorage.getItem("observatory-book");
    if(Object.hasOwn(E.books||{},saved))book=saved;

}
