name: Market edition
on:
  workflow_dispatch:
  repository_dispatch:
    types: [market-refresh]
  schedule:
    - cron: '17 7 * * 1-5'
      timezone: America/New_York
    - cron: '0 9 * * 1-5'
      timezone: America/New_York
    - cron: '30 12,16 * * 1-5'
      timezone: America/New_York
    - cron: '47 22 * * 1-5'
      timezone: America/New_York
    - cron: '17 10 * * 0,6'
      timezone: America/New_York
    - cron: '13,28,43,58 * * * *'
      timezone: America/New_York

permissions:
  contents: write
  actions: read
concurrency:
  group: publish-market-edition
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect, verify and publish the due market slot
        run: python scripts/pipeline.py refresh --publish
      - name: Retain run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/market-pipeline-state.json
            runs/*/refresh-${{ github.run_id }}-${{ github.run_attempt }}.json
            runs/candidates/*/${{ github.run_id }}-${{ github.run_attempt }}-*.json
            dashboard/observatory.html
          if-no-files-found: warn
          retention-days: 30
