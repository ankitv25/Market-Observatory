name: Market edition
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7,13 * * 1-5'
      timezone: America/New_York
    - cron: '47 18,22 * * 1-5'
      timezone: America/New_York
    - cron: '17 10 * * 0,6'
      timezone: America/New_York
    - cron: '43 * * * *'
      timezone: America/New_York

permissions:
  contents: write
concurrency:
  group: publish-market-edition
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scheduled target
        id: cadence
        run: python scripts/cadence.py
      - name: Collect and render edition
        if: steps.cadence.outputs.due == 'true'
        run: |
          python scripts/refresh.py || python scripts/refresh.py
      - name: Validate edition and source dates
        if: steps.cadence.outputs.due == 'true'
        run: |
          python -m unittest discover -s tests -v
          python scripts/verify.py
          node tests/test_dashboard.cjs
      - name: Publish edition to the default branch
        if: steps.cadence.outputs.due == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CADENCE.md assets dashboard editions
          git commit -m "Publish market edition for run ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify the published README and data from GitHub
        if: steps.cadence.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/verify_remote.py
      - uses: actions/upload-artifact@v4
        if: steps.cadence.outputs.due == 'true'
        with:
          name: Market-Observatory-${{ github.run_number }}
          path: dashboard/observatory.html
          if-no-files-found: error
          retention-days: 30
