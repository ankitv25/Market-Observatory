name: Market edition
on:
  workflow_dispatch:
  schedule:
    - cron: '45 11 * * 1-5'
    - cron: '30 23 * * 1-5'

permissions:
  contents: write
concurrency:
  group: publish-market-edition
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and render edition
        run: python scripts/refresh.py
      - name: Validate edition and source dates
        run: python scripts/verify.py
      - name: Publish edition to the default branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CADENCE.md assets dashboard editions
          git commit -m "Publish market edition for run ${GITHUB_RUN_ID}"
          git push origin HEAD:main
      - name: Verify the published README and data from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/verify_remote.py
      - uses: actions/upload-artifact@v4
        with:
          name: Market-Observatory-${{ github.run_number }}
          path: dashboard/observatory.html
          if-no-files-found: error
          retention-days: 30
