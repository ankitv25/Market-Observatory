name: Publish live dashboard
on:
  push:
    branches: [main]
    paths:
      - dashboard/observatory.html
      - docs/DESK_DESIGNS.md
      - scripts/build_desk_designs.py
      - scripts/desk_design.css
      - scripts/pipeline.py
      - .github/workflows/pages.yml
  workflow_run:
    workflows: [Market edition]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: market-observatory-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare edition and compare with served content
        id: gate
        run: python scripts/pipeline.py pages-prepare
      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.deploy == 'true'
        with:
          path: public
      - name: Wait for the uploaded artifact to become visible
        if: steps.gate.outputs.deploy == 'true'
        run: python scripts/pipeline.py pages-wait
      - name: Deploy verified edition
        uses: actions/deploy-pages@v4
        if: steps.gate.outputs.deploy == 'true'
        id: deployment
        continue-on-error: true
      - name: Recheck artifact before retry
        if: steps.deployment.outcome == 'failure'
        run: |
          sleep 10
          python scripts/pipeline.py pages-wait
      - name: Retry deployment
        uses: actions/deploy-pages@v4
        if: steps.deployment.outcome == 'failure'
        id: retry
        continue-on-error: true
      - name: Verify the served edition
        if: steps.deployment.outcome == 'success' || steps.retry.outcome == 'success'
        run: python scripts/pipeline.py pages-verify
      - name: Record deployment outcome
        if: always()
        run: python scripts/pipeline.py pages-finish --publish
      - name: Retain deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/market-pipeline-state.json
            runs/*/pages-${{ github.run_id }}-${{ github.run_attempt }}.json
            public/manifest.json
          if-no-files-found: warn
          retention-days: 30
